# FlipyERP Academy · nginx (host) para academy.flipyerp.com
# Instalar en /etc/nginx/sites-available/academy y enlazar en sites-enabled.
# Los certificados los añade certbot (ver deploy/DESPLIEGUE.md).

# Límite de peticiones a los endpoints de autenticación (además del límite
# por IP y email que ya aplica la aplicación).
limit_req_zone $binary_remote_addr zone=academy_auth:10m rate=10r/m;

upstream academy {
    server 127.0.0.1:8090;
    keepalive 16;
}

server {
    listen 80;
    server_name academy.flipyerp.com;

    # certbot necesita este camino para validar el dominio.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # nginx 1.24 (Ubuntu 24.04): `http2 on;` no existe hasta la 1.25.1.
    listen 443 ssl http2;
    server_name academy.flipyerp.com;

    # Rutas que certbot rellena con su propio certificado.
    ssl_certificate     /etc/letsencrypt/live/academy.flipyerp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academy.flipyerp.com/privkey.pem;

    # El estado de estudio de un alumno puede crecer (la app admite hasta 25 MB).
    client_max_body_size 26M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Cabeceras que la aplicación usa para IP, protocolo y origen.
    # X-Forwarded-For se SOBRESCRIBE con la IP real (no se añade): la app toma
    # el primer valor para limitar intentos de login y no debe poder falsearse.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /api/auth/ {
        limit_req zone=academy_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://academy;
    }

    location /api/health {
        access_log off;
        proxy_pass http://academy;
    }

    location / {
        proxy_pass http://academy;
        proxy_read_timeout 60s;
    }
}
