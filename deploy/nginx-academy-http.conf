# FlipyERP Academy · vhost provisional, solo :80.
# Se usa UNA vez, en la primera instalación, para que certbot encuentre el
# server_name y emita el certificado. Después se sustituye por nginx-academy.conf.

server {
    listen 80;
    server_name academy.flipyerp.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 503; }
}
